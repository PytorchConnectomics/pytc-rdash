name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: board tests
        run: python3 -m unittest discover -s dashboard/tests -t .
      - name: probe tests
        run: cd probe && python3 -m unittest discover -s tests
      - name: planner-loop checker tests
        run: python3 -m unittest discover -s rloop/focus/planner-loop -p 'test_*.py'
